server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # gzip：JS/CSS 文本压缩传输（Vue 产物 60KB gzip 后 ~19KB）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 反向代理：后端 API / 上传文件 / 健康检查（服务名 server 走 compose 内网 DNS）----
    # 不带尾路径的 proxy_pass 会原样保留 URI——后端路由就是按 /api/v1/... 注册的，恰好无缝
    # ^~ 前缀优先：阻止下方 .png 等正则 location 抢走请求（正则优先级高于普通前缀），
    # 否则 /uploads/xxx.png 会被静态缓存规则劫持到 nginx 本地目录导致 404
    location ^~ /api/     { proxy_pass http://server:8080; }
    location ^~ /uploads/ { proxy_pass http://server:8080; }
    location = /healthz   { proxy_pass http://server:8080; }

    # 静态资源：带 hash 指纹的文件可以长缓存
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- SPA 回退：/posts/123 这类前端路由在磁盘上不存在，统一回 index.html ----
    # 这是 vue-router history 模式的标配（否则刷新页面 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
